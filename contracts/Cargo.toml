[workspace]
members = ["ssl", "test-token"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
near-sdk = "5.29.1"
near-contract-standards = "5.29.1"
near-workspaces = { version = "0.23.0", features = ["unstable"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
