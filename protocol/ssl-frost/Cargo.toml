[package]
name = "ssl-frost"
version = "0.1.0"
description = "Rerandomized FROST (RedPallas) signing rounds for ZEC SSL treasury spends"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
hex.workspace = true
serde.workspace = true
toml = "0.8"
# Exactly the FROST stack ZcashFoundation/frost-tools (53df99c) uses, so key packages
# produced by its DKG load unchanged.
reddsa = { git = "https://github.com/ZcashFoundation/reddsa.git", rev = "ed49e9ca0699a6450f6d4a9fe62ff168f5ea1ead", features = ["frost", "serde"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
ssl-sign = { path = "../ssl-sign" }
